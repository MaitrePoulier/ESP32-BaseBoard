; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_wroom_32e_n8r2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- 1. SPEED UP FLASHING / PROGRAMMING ---
upload_speed = 921600         ; Drastically increases the data transfer rate to the chip
upload_protocol = esptool      ; Ensures fast physical flashing via standard hardware serial

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D COMPILATIONDB_INCLUDE_TOOLCHAIN=1
	-D PIO_PLATFORM_VERSION=\"6.13.0\"
	-DCORE_DEBUG_LEVEL=0

	;For using the User_Setup.h in the lib/General and not the one in the librairy
	;https://github.com/Bodmer/TFT_eSPI/wiki/Installing-on-PlatformIO
	-D USER_SETUP_LOADED=1
	-include $PROJECT_DIR/lib/General/User_Setup.h
	
lib_deps = bodmer/TFT_eSPI@^2.5.43

; --- 2. SPEED UP COMPILATION WORKFLOW ---
lib_ldf_mode = chain           ; Speeds up dependency parsing for TFT_eSPI
