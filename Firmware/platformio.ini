; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_wroom_32e_n8r2]

;https://registry.platformio.org/platforms/platformio/espressif32/versions
;platform = espressif32@7.0.1

;https://github.com/sivar2311/platform-espressif32-versions
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D COMPILATIONDB_INCLUDE_TOOLCHAIN=1
	-D PIO_PLATFORM_VERSION=\"55.03.39\"
	-DCORE_DEBUG_LEVEL=5
	
	-D USER_SETUP_LOADED=1
	-include $PROJECT_DIR/lib/Config/User_Setup.h
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^8.3.0  ;9.5.0
lib_ldf_mode = chain
